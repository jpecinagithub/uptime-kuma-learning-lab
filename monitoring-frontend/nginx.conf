# Nginx del Educational Dashboard (monitoring-frontend)
# - Sirve la SPA con fallback a /index.html (react-router)
# - /api/* se proxya al contenedor monitoring-api (red interna Docker).
#   El navegador NUNCA habla directamente con Uptime Kuma ni con el backend por otro puerto.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Capa API propia
    location /api/ {
        proxy_pass http://monitoring-api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # SPA: cualquier ruta no estática -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
